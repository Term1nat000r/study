<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генеративный ИИ — конспект</title>
<style>
  @media print {
    body { font-size: 11pt; }
    pre, code { font-size: 9pt; }
    h1, h2, h3 { break-after: avoid; }
    table, pre, blockquote { break-inside: avoid; }
    .mermaid, img { break-inside: avoid; }
    hr { border: none; height: 1px; background: #ccc; margin: 1em 0; }
    @page { margin: 1.8cm; }
  }
  @media screen {
    body { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
  }
  body {
    font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
    line-height: 1.6;
    color: #1a1a1a;
    background: #fff;
  }
  h1 { font-size: 1.8em; border-bottom: 2px solid #333; padding-bottom: 0.3em; margin-top: 2em; }
  h2 { font-size: 1.4em; border-bottom: 1px solid #ccc; padding-bottom: 0.2em; }
  h3 { font-size: 1.2em; }
  blockquote {
    border-left: 4px solid #4A90D9;
    margin: 1em 0;
    padding: 0.5em 1em;
    background: #f0f4f8;
    color: #333;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 0.5em 0.8em;
    text-align: left;
  }
  th { background: #f5f5f5; font-weight: 600; }
  pre {
    background: #f6f8fa;
    border: 1px solid #e1e4e8;
    border-radius: 6px;
    padding: 1em;
    overflow-x: auto;
  }
  code {
    font-family: "Fira Code", "JetBrains Mono", "Consolas", monospace;
    font-size: 0.9em;
  }
  :not(pre) > code {
    background: #f0f0f0;
    padding: 0.15em 0.4em;
    border-radius: 3px;
  }
  img { max-width: 100%; height: auto; margin: 1em 0; }
  .mermaid { margin: 1.5em 0; text-align: center; }
  .toc { background: #fafafa; border: 1px solid #ddd; padding: 1.5em; border-radius: 8px; margin: 2em 0; }
  .toc h3 { margin-top: 1em; }
  .toc h3:first-child { margin-top: 0; }
  .toc ol { margin: 0.3em 0; padding-left: 1.5em; }
</style>
</head>
<body>

<div id="content">Загрузка...</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({
  startOnLoad: false,
  theme: 'default',
  securityLevel: 'loose',
  flowchart: { useMaxWidth: true, htmlLabels: true }
});

const renderer = new marked.Renderer();

// Collect mermaid blocks to render after
let mermaidId = 0;
const mermaidBlocks = [];

renderer.code = function({ text, lang }) {
  if (lang === 'mermaid') {
    const id = 'mermaid-' + (mermaidId++);
    mermaidBlocks.push({ id, text });
    return '<div class="mermaid" id="' + id + '"></div>';
  }
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<pre><code class="language-' + (lang||'') + '">' + escaped + '</code></pre>';
};

marked.setOptions({ renderer, breaks: false, gfm: true });

fetch('Книга — Генеративный ИИ.md')
  .then(r => {
    if (!r.ok) throw new Error('Не удалось загрузить MD: ' + r.status);
    return r.text();
  })
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
    // Render mermaid diagrams
    return Promise.all(mermaidBlocks.map(async ({ id, text }) => {
      try {
        const { svg } = await mermaid.render(id + '-svg', text);
        document.getElementById(id).innerHTML = svg;
      } catch (e) {
        document.getElementById(id).innerHTML =
          '<pre style="color:red;border:2px solid red;padding:1em;">Ошибка Mermaid:\n' +
          e.message + '\n\nКод:\n' + text + '</pre>';
      }
    }));
  })
  .then(() => console.log('Все диаграммы отрисованы'))
  .catch(err => {
    document.getElementById('content').innerHTML =
      '<h1>Ошибка</h1><p>' + err.message + '</p>' +
      '<p>HTML и MD файлы должны лежать в одной папке. Откройте через локальный сервер (см. инструкцию).</p>';
  });
</script>

</body>
</html>
